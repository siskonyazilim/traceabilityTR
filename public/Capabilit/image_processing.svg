<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>

  <!-- Camera / lens outer ring -->
  <circle cx="50" cy="50" r="26" stroke="#818CF8" stroke-width="2" opacity="0.9"/>

  <!-- Lens inner circles -->
  <circle cx="50" cy="50" r="19" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="13" fill="#2E2799" opacity="0.6"/>
  <circle cx="50" cy="50" r="8"  fill="#4338CA" opacity="0.8"/>
  <circle cx="50" cy="50" r="4"  fill="#818CF8"/>

  <!-- Lens glint -->
  <circle cx="44" cy="44" r="2" fill="white" opacity="0.35"/>

  <!-- Corner scan brackets -->
  <!-- Top-left -->
  <path d="M18 26 L18 18 L26 18" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top-right -->
  <path d="M82 26 L82 18 L74 18" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom-left -->
  <path d="M18 74 L18 82 L26 82" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom-right -->
  <path d="M82 74 L82 82 L74 82" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Defect detection tick (checkmark) -->
  <circle cx="68" cy="32" r="8" fill="#10B981"/>
  <path d="M63.5 32 L66.5 35 L72.5 29" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="47" stroke="#818CF8" stroke-width="0.5" opacity="0.25" stroke-dasharray="5 7"/>
</svg>
